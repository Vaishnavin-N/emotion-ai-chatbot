<ion-content class="chat-page">

  <!-- Header -->
  <div class="chat-header">
    <h1>EmoCare AI</h1>
    <p>Your safe emotional space</p>
  </div>

  <!-- Messages -->
  <div class="chat-body">
    <div
      *ngFor="let msg of messages"
      class="chat-bubble"
      [ngClass]="msg.role === 'user' ? 'user-bubble' : 'bot-bubble'"
    >
      {{ msg.content }}
    </div>
  </div>

</ion-content>

<!-- Footer -->
<ion-footer class="chat-footer">

  <!-- Sound wave shown while recording -->
  <div class="sound-wave" *ngIf="isRecording">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="chat-input-container">

    <!-- Input -->
    <input
      type="text"
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      placeholder="Speak or type your feelings..."
    />

    <!-- Tick button shown while recording -->
    <button *ngIf="isRecording" type="button" class="tick-btn" (click)="confirmVoice()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M5 13l4 4L19 7" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Mic Button shown when not recording -->
    <button *ngIf="!isRecording" type="button" class="mic-btn" (click)="startVoiceInput()">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path
          d="M12 14a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v4a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"
          fill="none" stroke="#4b5563" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
        />
      </svg>
    </button>

    <!-- Send Button -->
    <button *ngIf="!isRecording" type="button" class="send-btn" (click)="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path d="M12 6V18M12 6L7 11M12 6L17 11" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  </div>

</ion-footer>
